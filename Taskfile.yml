# https://taskfile.dev — task build system for UNOB thesis template
version: "3"

vars:
  PROJECT_DIR: '{{.TASKFILE_DIR}}'
  ROOT: '{{.TASKFILE_DIR}}'
  FONT_PATH: '{{.TASKFILE_DIR}}/template/fonts'
  # --ignore-system-fonts: systémový font nemůže zastínit bundlované TeX Gyre
  # (lokální build ≡ CI ≡ Universe) a odpadá sken systémových fontů.
  TYPST_FLAGS: '--root={{.TASKFILE_DIR}} --font-path={{.TASKFILE_DIR}}/template/fonts --ignore-system-fonts'
  INPUT: '{{.TASKFILE_DIR}}/main.typ'
  OUTPUT: '{{.TASKFILE_DIR}}/build/thesis.pdf'
  DRAFT_OUTPUT: '{{.TASKFILE_DIR}}/build/draft.pdf'

tasks:
  default:
    desc: "Compile thesis (default)"
    cmds:
      - task: build

  build:
    desc: "Compile thesis (final output)"
    cmds:
      - mkdir -p '{{.PROJECT_DIR}}/build'
      - typst compile {{.TYPST_FLAGS}} {{.INPUT}} {{.OUTPUT}}
    sources:
      - '{{.PROJECT_DIR}}/template/main.typ'
      - '{{.PROJECT_DIR}}/src/**/*.typ'
      - '{{.PROJECT_DIR}}/template/**/*'
    generates:
      - '{{.OUTPUT}}'

  pdfa:
    desc: "Compile to PDF/A-3b (archival submission)"
    cmds:
      - mkdir -p '{{.PROJECT_DIR}}/build'
      - typst compile --pdf-standard a-3b {{.TYPST_FLAGS}} {{.INPUT}} {{.PROJECT_DIR}}/build/thesis-a3b.pdf

  pdfua:
    desc: "Compile to PDF/UA-1 (accessibility)"
    cmds:
      - mkdir -p '{{.PROJECT_DIR}}/build'
      - typst compile --pdf-standard ua-1 {{.TYPST_FLAGS}} {{.INPUT}} {{.PROJECT_DIR}}/build/thesis-ua1.pdf

  archive:
    desc: "Compile to PDF/A-3b + PDF/UA-1 (archival + accessible)"
    cmds:
      - mkdir -p '{{.PROJECT_DIR}}/build'
      - typst compile --pdf-standard a-3b,ua-1 {{.TYPST_FLAGS}} {{.INPUT}} {{.PROJECT_DIR}}/build/thesis-archive.pdf

  watch:
    desc: "Watch for changes and recompile"
    cmds:
      - typst watch {{.TYPST_FLAGS}} {{.INPUT}} {{.OUTPUT}}

  draft:
    desc: "Compile in draft mode (faster, wider margins)"
    cmds:
      - mkdir -p '{{.PROJECT_DIR}}/build'
      - typst compile {{.TYPST_FLAGS}} {{.INPUT}} {{.DRAFT_OUTPUT}}
    sources:
      - '{{.PROJECT_DIR}}/template/main.typ'
      - '{{.PROJECT_DIR}}/src/**/*.typ'
      - '{{.PROJECT_DIR}}/template/**/*'
    generates:
      - '{{.DRAFT_OUTPUT}}'

  fonts:
    desc: "List available fonts"
    cmds:
      - typst fonts --font-path={{.FONT_PATH}} --ignore-system-fonts

  preview:
    desc: "Build + open in zathura PDF viewer"
    deps:
      - build
    cmds:
      - 'zathura {{.OUTPUT}} > /dev/null 2>&1 &'

  watch-preview:
    desc: "Watch and auto-refresh in zathura"
    deps:
      - build
    cmds:
      - 'zathura {{.OUTPUT}} > /dev/null 2>&1 &'
      - typst watch {{.TYPST_FLAGS}} {{.INPUT}} {{.OUTPUT}}

  new-chapter:
    desc: "Založí novou kapitolu: task new-chapter -- Název kapitoly"
    silent: true
    cmds:
      - |
        # CLI_ARGS s mezerami přijdou v uvozovkách — set -- je nechá shell sloupnout.
        set -- {{.CLI_ARGS}}
        name="$*"
        if [ -z "$name" ]; then
          echo 'Použití: task new-chapter -- Název kapitoly' >&2; exit 1
        fi
        # V repu jsou kapitoly v template/chapters, v initnutém projektu v chapters.
        dir='{{.PROJECT_DIR}}/chapters'
        [ -d "$dir" ] || dir='{{.PROJECT_DIR}}/template/chapters'
        # Transliterace diakritiky (NFKD → ascii). Task interpretuje příkazy
        # vlastním shellem (mvdan/sh) i na Windows — jediná externí závislost
        # je zde Python (python3 na Unixu, python/py na Windows).
        py=''
        for cand in python3 python py; do
          if command -v "$cand" >/dev/null; then py="$cand"; break; fi
        done
        if [ -z "$py" ]; then
          echo 'new-chapter potřebuje Python (transliterace názvu na název souboru).' >&2; exit 1
        fi
        slug=$("$py" -c "import sys,unicodedata,re; s=unicodedata.normalize('NFKD',sys.argv[1]).encode('ascii','ignore').decode(); print(re.sub(r'[^a-z0-9]+','-',s.lower()).strip('-'))" "$name")
        if [ -z "$slug" ]; then echo "Z názvu nejde odvodit název souboru." >&2; exit 1; fi
        # Další volné číslo (99 je rezervováno pro závěr) — čistě shell builtiny,
        # žádné sed/grep/sort, které na Windows nejsou.
        last=0
        for f in "$dir"/[0-9][0-9]-*.typ; do
          [ -e "$f" ] || continue
          b="${f##*/}"; n="${b%%-*}"
          [ "$n" = "99" ] && continue
          if [ $((10#$n)) -gt "$last" ]; then last=$((10#$n)); fi
        done
        num=$(printf '%02d' $((last + 1)))
        f="$dir/$num-$slug.typ"
        if [ -e "$f" ]; then echo "Soubor už existuje: $f" >&2; exit 1; fi
        printf '= %s\n\n' "$name" > "$f"
        echo "Vytvořeno: $f"
        echo 'Přidej do main.typ PŘED #conclusion[…]:'
        echo "  #include \"chapters/$num-$slug.typ\""

  clean:
    desc: "Remove build artifacts"
    cmds:
      - rm -rf '{{.PROJECT_DIR}}/build/'
