name: Typst CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release-tag:
        description: Exact v<package.version> tag required for release builds
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: typst-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Test, build, and package Typst template
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TYPST_PACKAGE_CACHE_PATH: ${{ github.workspace }}/.cache/typst
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y poppler-utils
      - name: Install checksum-verified Typst
        run: bash scripts/install-typst.sh "$RUNNER_TEMP/typst"
      - name: Cache downloaded Typst packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TYPST_PACKAGE_CACHE_PATH }}
          key: typst-packages-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('typst.toml', 'src/styling/packages.typ', 'examples/**/*.typ') }}
          restore-keys: |
            typst-packages-${{ runner.os }}-${{ runner.arch }}-
      - name: Test public behavior and compile the distributable
        env:
          RELEASE_TAG: ${{ inputs.release-tag }}
        run: python3 scripts/ci.py check --output dist --tag "$RELEASE_TAG"
      - name: Validate PDF/A-3b and PDF/UA-1 with veraPDF
        # verapdf/cli v1.30.3, připnuto na digest; nenulový výstup = nesplňuje normu.
        run: |
          verapdf() { docker run --rm -v "$PWD/dist:/data:ro" verapdf/cli@sha256:d565095c67a083e693aebf7d1a15784007370571053fc1aa5b502665b9a78f9c "$@"; }
          verapdf --flavour 3b --format text /data/pdf-a-3b.pdf /data/ukazka-diplomka-pdfa.pdf
          verapdf --flavour ua1 --format text /data/pdf-ua-1.pdf
      - name: Upload validated PDFs and package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: typst-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 14
