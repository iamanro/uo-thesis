name: Typst release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: typst-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate tagged package
    uses: ./.github/workflows/ci.yml
    with:
      release-tag: ${{ github.ref_name }}
    permissions:
      contents: read

  publish:
    name: Publish tested artifacts to GitHub Releases
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download the artifacts produced by validation
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: typst-dist
          path: dist
      - name: Verify artifact checksums
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS
      - name: Create the release without overwriting existing releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag --generate-notes --title "$RELEASE_TAG"
